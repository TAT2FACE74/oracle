<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>BORDER RUN</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="420" height="740"></canvas>
  <div id="hud">
    <span id="livesEl">❤❤❤</span>
    <span id="progEl">BORDER 0%</span>
    <span id="scoreEl">SCORE 0</span>
  </div>
  <button id="muteBtn" type="button">🔊 SIRENS</button>
  <div id="overlay">
    <div class="panel">
      <h1 id="ovTitle">BORDER RUN</h1>
      <div class="sub" id="ovSub">Escaped Inmate vs the Cops</div>
      <p id="ovBody">Dodge oncoming police on a 4-lane highway. Reach México. Get hit and leave a blood smear that stays until game over.</p>
      <button id="startBtn" type="button">START RUNNING</button>
    </div>
  </div>
  <div id="pad" aria-label="Controller">
    <button type="button" class="pad-btn" data-dir="up" style="grid-area:up">▲</button>
    <button type="button" class="pad-btn" data-dir="left" style="grid-area:left">◀</button>
    <button type="button" class="pad-btn" data-dir="right" style="grid-area:right">▶</button>
    <button type="button" class="pad-btn" data-dir="down" style="grid-area:down">▼</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
